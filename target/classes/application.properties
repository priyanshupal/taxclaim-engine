spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/taxclaim_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.dll-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

resilience4j.circuitbreaker.instances.aiFraudService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiFraudService.minimum-number-of=calls=4
resilience4j.circuitbreaker.instances.aiFraudService.sliding-window-size=4
resilience4j.circuitbreaker.instances.aiFraudService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.aiFraudService.permitted-number-of-calls-in-half-open-state=2